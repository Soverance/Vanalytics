# Vanalytics CI/CD Pipeline
# Scott McCutchen
# scott.mccutchen@soverance.com
#
# Builds a Docker image, pushes to Azure Container Registry, and deploys
# to soverance-vm over SSH (docker compose stack at /opt/soverance).
#
# The VM's port 22 is closed to the internet. The deploy job reaches sshd
# through the VM's WireGuard admin tunnel, as peer ci-vanalytics (10.98.0.21).
# The VM end, the peer list and what to do when the tunnel is down: IaC repo,
# ansible role configure_admin_tunnel (README.md).
#
# Secrets: ACR_USERNAME, ACR_PASSWORD, VM_HOST (public address, the tunnel's
#          endpoint), VM_WG_PRIVATE_KEY (this pipeline's tunnel key),
#          VM_HOST_KEY (the VM's ssh host key: `ssh-keyscan` output),
#          VM_SSH_USER, VM_SSH_KEY,
#          SQL_CONNECTION_STRING, ADMIN_PASSWORD, JWT_SECRET,
#          AZURE_STORAGE_CONNECTION_STRING,
#          GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_SECRET, DISCORD_CLIENT_SECRET
# Variables: ADMIN_EMAIL, ADMIN_USERNAME,
#            JWT_ISSUER, JWT_AUDIENCE,
#            AZURE_AD_CLIENT_ID, AZURE_AD_DOMAIN, AZURE_AD_TENANT_ID,
#            GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID, DISCORD_CLIENT_ID

name: Build and Deploy

on:
  push:
    branches: [main]

# One run at a time. Two runs at once would compute the same version number,
# and would take the tunnel from each other (both use the same tunnel key).
# A newer push waits for the running one. If several pile up, only the newest
# waits: GitHub cancels the older waiting runs.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  # Schema-drift gate, ahead of the image build so a drifted model never ships.
  # build.yml runs this too, but only on pull requests — a push straight to main
  # would otherwise bypass it entirely.
  guard:
    name: Schema Drift Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.5

      - name: Restore NuGet packages
        # dotnet-ef 10 reads project metadata before it builds, and that needs
        # obj/project.assets.json — on a fresh checkout it dies with NETSDK1004.
        # build.yml gets away without this step only because `dotnet build`
        # runs ahead of the guard there. Restoring the startup project covers
        # Vanalytics.Data through its project reference.
        run: dotnet restore src/Vanalytics.Api

      - name: Check for pending EF model changes
        # Exits 1 when the EF model has changes no migration covers — the failure
        # that put soverance.com's SAML sign-in down for two days in 2026-09.
        run: dotnet ef migrations has-pending-model-changes --project src/Vanalytics.Data --startup-project src/Vanalytics.Api
        env:
          # There is no IDesignTimeDbContextFactory, so DI needs a connection
          # string to construct the context. EF compares the model against the
          # snapshot and never opens a connection, so this value is never used.
          ConnectionStrings__DefaultConnection: "Server=ci-nowhere;Database=ci;User Id=ci;Password=ci;TrustServerCertificate=True"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="1.0.0"
          else
            CURRENT="${LATEST_TAG#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Stamp addon version
        run: |
          # Rewrite the hardcoded addon version so the bundled/downloadable
          # addon advertises the same version as this deployment. Mutates the
          # runner checkout only (not committed); the file is copied into the
          # image by the csproj <Content Include> and zipped at runtime by
          # AddonController. The committed file keeps a dev-sentinel version.
          sed -i "s/^_addon\.version = '.*'/_addon.version = '${{ steps.version.outputs.version }}'/" \
            addon/vanalytics/vanalytics.lua
          echo "Stamped: $(grep '^_addon.version' addon/vanalytics/vanalytics.lua)"

      - name: Clear Docker credentials
        run: docker logout

      - name: Build Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build -f src/Vanalytics.Api/Dockerfile . \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }} \
            --build-arg VITE_MICROSOFT_CLIENT_ID=${{ vars.MICROSOFT_CLIENT_ID }} \
            --build-arg VITE_DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }} \
            -t soveranceacr.azurecr.io/vanalytics:v${{ steps.version.outputs.version }} \
            -t soveranceacr.azurecr.io/vanalytics:latest

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: soveranceacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push soveranceacr.azurecr.io/vanalytics:v${{ steps.version.outputs.version }}
          docker push soveranceacr.azurecr.io/vanalytics:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Generate environment file
        env:
          SQL_CONN: ${{ secrets.SQL_CONNECTION_STRING }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SEC: ${{ secrets.JWT_SECRET }}
          AZURE_STORAGE: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          DISCORD_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          umask 077   # secrets file: owner-only from the moment it exists
          {
            printf 'ConnectionStrings__DefaultConnection=%s\n' "$SQL_CONN"
            printf 'ADMIN_EMAIL=%s\n'    '${{ vars.ADMIN_EMAIL }}'
            printf 'ADMIN_USERNAME=%s\n' '${{ vars.ADMIN_USERNAME }}'
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASS"
            printf 'Jwt__Secret=%s\n'    "$JWT_SEC"
            printf 'Jwt__Issuer=%s\n'    '${{ vars.JWT_ISSUER }}'
            printf 'Jwt__Audience=%s\n'  '${{ vars.JWT_AUDIENCE }}'
            printf 'Jwt__AccessTokenExpirationMinutes=15\n'
            printf 'Jwt__RefreshTokenExpirationDays=7\n'
            printf 'ASPNETCORE_ENVIRONMENT=Production\n'
            printf 'Logging__LogLevel__Default=Warning\n'
            printf 'Logging__LogLevel__Microsoft.AspNetCore=Warning\n'
            printf 'Logging__LogLevel__Microsoft.EntityFrameworkCore=Warning\n'
            printf 'DISABLE_HTTPS_REDIRECT=true\n'
            printf 'Authentication__AzureAd__ClientId=%s\n' '${{ vars.AZURE_AD_CLIENT_ID }}'
            printf 'Authentication__AzureAd__Domain=%s\n'   '${{ vars.AZURE_AD_DOMAIN }}'
            printf 'Authentication__AzureAd__TenantId=%s\n' '${{ vars.AZURE_AD_TENANT_ID }}'
            printf 'AzureStorage__ConnectionString=%s\n' "$AZURE_STORAGE"
          } > vanalytics.env
          if [ -n "$GOOGLE_SECRET" ]; then
            {
              printf 'OAuth__Google__ClientId=%s\n' '${{ vars.GOOGLE_CLIENT_ID }}'
              printf 'OAuth__Google__ClientSecret=%s\n' "$GOOGLE_SECRET"
            } >> vanalytics.env
          fi
          if [ -n "$MICROSOFT_SECRET" ]; then
            {
              printf 'OAuth__Microsoft__ClientId=%s\n' '${{ vars.MICROSOFT_CLIENT_ID }}'
              printf 'OAuth__Microsoft__ClientSecret=%s\n' "$MICROSOFT_SECRET"
              printf 'Authentication__AzureAd__ClientSecret=%s\n' "$MICROSOFT_SECRET"
            } >> vanalytics.env
          fi
          if [ -n "$DISCORD_SECRET" ]; then
            {
              printf 'OAuth__Discord__ClientId=%s\n' '${{ vars.DISCORD_CLIENT_ID }}'
              printf 'OAuth__Discord__ClientSecret=%s\n' "$DISCORD_SECRET"
            } >> vanalytics.env
          fi

      # The VM's public key and tunnel addresses are not secrets and are written
      # here; the private key and the VM's public address are.
      - name: Open the tunnel to the VM
        env:
          VM_WG_PRIVATE_KEY: ${{ secrets.VM_WG_PRIVATE_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          key=$(printf '%s' "$VM_WG_PRIVATE_KEY" | tr -d ' \r\n')
          if [ "${#key}" -ne 44 ]; then
            # Shape only, never the value.
            echo "::error::Secret VM_WG_PRIVATE_KEY is missing or not a WireGuard key (${#key} characters, expected 44)."
            exit 1
          fi
          if ! command -v wg-quick >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends wireguard-tools
          fi
          umask 077
          {
            echo '[Interface]'
            echo 'Address = 10.98.0.21/32'
            printf 'PrivateKey = %s\n' "$key"
            echo '[Peer]'
            echo 'PublicKey = DbfoSy0N6KFbmcFqQGyo1a58uaLGLZTzBPNto9ZJRyo='
            printf 'Endpoint = %s:51821\n' "$VM_HOST"
            echo 'AllowedIPs = 10.98.0.1/32'
            echo 'PersistentKeepalive = 25'
          } > "$RUNNER_TEMP/vm.conf"
          sudo wg-quick up "$RUNNER_TEMP/vm.conf"
          # The first packet starts the handshake. Fail here with the likely
          # causes, not later in an ssh step with a bare timeout.
          for _ in 1 2 3 4 5; do
            if timeout 5 bash -c 'exec 3<>/dev/tcp/10.98.0.1/22' 2>/dev/null; then
              echo "Tunnel is up: sshd answers on 10.98.0.1."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The tunnel is configured but 10.98.0.1:22 does not answer. Check VM_WG_PRIVATE_KEY against peer ci-vanalytics on the VM, VM_HOST, and the NSG rule Allow-WireGuard-Admin (UDP 51821)."
          sudo wg show vm latest-handshakes | awk '{ print "Last handshake (unix time, 0 = never): " $2 }'
          exit 1

      # Plain ssh/scp from the runner image. No third-party actions: these
      # steps hold the SSH key and every production secret.
      - name: Set up SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST_KEY: ${{ secrets.VM_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key, so the runner refuses to talk to anything that
          # isn't the VM. Accepts full `ssh-keyscan` lines ("host type key")
          # or just "type key"; whatever host name was scanned is replaced by
          # the alias `vm` (see HostKeyAlias). CRs from Windows pastes are dropped.
          printf '%s\n' "$VM_HOST_KEY" | tr -d '\r' | awk '
            $1 ~ /^#/ { next }
            { for (i = 1; i < NF; i++) if ($i ~ /^(ssh-|ecdsa-|sk-)/) { print "vm", $i, $(i+1); break } }
          ' > ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            # Shape only, never the values: line count and fields per line.
            echo "::error::No host key found in VM_HOST_KEY (${#VM_HOST_KEY} chars; fields per line: $(printf '%s\n' "$VM_HOST_KEY" | awk '{printf "%s ", NF}'))"
            exit 1
          fi
          echo "Pinned host key types: $(awk '{print $2}' ~/.ssh/known_hosts | paste -sd ' ')"
          {
            echo 'Host vm'
            echo '  HostName 10.98.0.1'   # the VM inside the tunnel
            echo "  User ${{ secrets.VM_SSH_USER }}"
            echo '  HostKeyAlias vm'
            echo '  IdentityFile ~/.ssh/id_deploy'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
            echo '  BatchMode yes'
            echo '  ConnectTimeout 30'
          } > ~/.ssh/config

      - name: Copy environment file to VM
        run: scp -p vanalytics.env vm:/opt/soverance/vanalytics.env

      - name: Deploy container
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE: soveranceacr.azurecr.io/vanalytics:v${{ needs.build.outputs.version }}
        run: |
          # Values travel inside the script on stdin (%q-quoted), not on the
          # ssh command line, so they never show up in the VM's process list.
          {
            printf 'IMAGE=%q\n' "$IMAGE"
            printf 'ACR_USERNAME=%q\n' "$ACR_USERNAME"
            printf 'ACR_PASSWORD=%q\n' "$ACR_PASSWORD"
            cat <<'EOF'
          set -e
          cd /opt/soverance
          chmod 600 vanalytics.env
          sed -i "s|^VANALYTICS_IMAGE=.*|VANALYTICS_IMAGE=$IMAGE|" .env
          printf '%s\n' "$ACR_PASSWORD" | docker login soveranceacr.azurecr.io -u "$ACR_USERNAME" --password-stdin
          docker compose pull vanalytics
          # --force-recreate: env_file content changes alone don't trigger
          # recreation, which strands same-image redeploys (secret rotations)
          # on stale env
          docker compose up -d --force-recreate vanalytics
          # -a: every release is tagged, so plain prune never removed old
          # ones; they filled the VM disk in 2026-11 and broke deploys.
          # Images in use are kept.
          docker image prune -af
          EOF
          } | ssh vm 'bash -s'

      - name: Close the tunnel
        if: always()
        run: |
          sudo wg-quick down "$RUNNER_TEMP/vm.conf" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/vm.conf"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create and push tag
        run: |
          git tag "v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build.outputs.version }}"
          name: "v${{ needs.build.outputs.version }}"
          generate_release_notes: true
