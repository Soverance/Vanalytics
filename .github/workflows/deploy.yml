# Vanalytics CI/CD Pipeline
# Scott McCutchen
# scott.mccutchen@soverance.com
#
# Builds a Docker image, pushes to Azure Container Registry, and deploys
# to soverance-vm over SSH (docker compose stack at /opt/soverance).
#
# Secrets: ACR_USERNAME, ACR_PASSWORD, VM_HOST, VM_SSH_USER, VM_SSH_KEY,
#          SQL_CONNECTION_STRING, ADMIN_PASSWORD, JWT_SECRET,
#          AZURE_STORAGE_CONNECTION_STRING,
#          GOOGLE_CLIENT_SECRET, MICROSOFT_CLIENT_SECRET, DISCORD_CLIENT_SECRET
# Variables: ADMIN_EMAIL, ADMIN_USERNAME,
#            JWT_ISSUER, JWT_AUDIENCE,
#            AZURE_AD_CLIENT_ID, AZURE_AD_DOMAIN, AZURE_AD_TENANT_ID,
#            GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID, DISCORD_CLIENT_ID

name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  # Schema-drift gate, ahead of the image build so a drifted model never ships.
  # build.yml runs this too, but only on pull requests — a push straight to main
  # would otherwise bypass it entirely.
  guard:
    name: Schema Drift Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.5

      - name: Check for pending EF model changes
        # Exits 1 when the EF model has changes no migration covers — the failure
        # that put soverance.com's SAML sign-in down for two days in 2026-09.
        run: dotnet ef migrations has-pending-model-changes --project src/Vanalytics.Data --startup-project src/Vanalytics.Api
        env:
          # There is no IDesignTimeDbContextFactory, so DI needs a connection
          # string to construct the context. EF compares the model against the
          # snapshot and never opens a connection, so this value is never used.
          ConnectionStrings__DefaultConnection: "Server=ci-nowhere;Database=ci;User Id=ci;Password=ci;TrustServerCertificate=True"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="1.0.0"
          else
            CURRENT="${LATEST_TAG#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Stamp addon version
        run: |
          # Rewrite the hardcoded addon version so the bundled/downloadable
          # addon advertises the same version as this deployment. Mutates the
          # runner checkout only (not committed); the file is copied into the
          # image by the csproj <Content Include> and zipped at runtime by
          # AddonController. The committed file keeps a dev-sentinel version.
          sed -i "s/^_addon\.version = '.*'/_addon.version = '${{ steps.version.outputs.version }}'/" \
            addon/vanalytics/vanalytics.lua
          echo "Stamped: $(grep '^_addon.version' addon/vanalytics/vanalytics.lua)"

      - name: Clear Docker credentials
        run: docker logout

      - name: Build Docker image
        run: |
          DOCKER_BUILDKIT=1 docker build -f src/Vanalytics.Api/Dockerfile . \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }} \
            --build-arg VITE_MICROSOFT_CLIENT_ID=${{ vars.MICROSOFT_CLIENT_ID }} \
            --build-arg VITE_DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }} \
            -t soveranceacr.azurecr.io/vanalytics:v${{ steps.version.outputs.version }} \
            -t soveranceacr.azurecr.io/vanalytics:latest

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: soveranceacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push soveranceacr.azurecr.io/vanalytics:v${{ steps.version.outputs.version }}
          docker push soveranceacr.azurecr.io/vanalytics:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Generate environment file
        env:
          SQL_CONN: ${{ secrets.SQL_CONNECTION_STRING }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SEC: ${{ secrets.JWT_SECRET }}
          AZURE_STORAGE: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          DISCORD_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          umask 077   # secrets file: owner-only from the moment it exists
          {
            printf 'ConnectionStrings__DefaultConnection=%s\n' "$SQL_CONN"
            printf 'ADMIN_EMAIL=%s\n'    '${{ vars.ADMIN_EMAIL }}'
            printf 'ADMIN_USERNAME=%s\n' '${{ vars.ADMIN_USERNAME }}'
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASS"
            printf 'Jwt__Secret=%s\n'    "$JWT_SEC"
            printf 'Jwt__Issuer=%s\n'    '${{ vars.JWT_ISSUER }}'
            printf 'Jwt__Audience=%s\n'  '${{ vars.JWT_AUDIENCE }}'
            printf 'Jwt__AccessTokenExpirationMinutes=15\n'
            printf 'Jwt__RefreshTokenExpirationDays=7\n'
            printf 'ASPNETCORE_ENVIRONMENT=Production\n'
            printf 'Logging__LogLevel__Default=Warning\n'
            printf 'Logging__LogLevel__Microsoft.AspNetCore=Warning\n'
            printf 'Logging__LogLevel__Microsoft.EntityFrameworkCore=Warning\n'
            printf 'DISABLE_HTTPS_REDIRECT=true\n'
            printf 'Authentication__AzureAd__ClientId=%s\n' '${{ vars.AZURE_AD_CLIENT_ID }}'
            printf 'Authentication__AzureAd__Domain=%s\n'   '${{ vars.AZURE_AD_DOMAIN }}'
            printf 'Authentication__AzureAd__TenantId=%s\n' '${{ vars.AZURE_AD_TENANT_ID }}'
            printf 'AzureStorage__ConnectionString=%s\n' "$AZURE_STORAGE"
          } > vanalytics.env
          if [ -n "$GOOGLE_SECRET" ]; then
            {
              printf 'OAuth__Google__ClientId=%s\n' '${{ vars.GOOGLE_CLIENT_ID }}'
              printf 'OAuth__Google__ClientSecret=%s\n' "$GOOGLE_SECRET"
            } >> vanalytics.env
          fi
          if [ -n "$MICROSOFT_SECRET" ]; then
            {
              printf 'OAuth__Microsoft__ClientId=%s\n' '${{ vars.MICROSOFT_CLIENT_ID }}'
              printf 'OAuth__Microsoft__ClientSecret=%s\n' "$MICROSOFT_SECRET"
              printf 'Authentication__AzureAd__ClientSecret=%s\n' "$MICROSOFT_SECRET"
            } >> vanalytics.env
          fi
          if [ -n "$DISCORD_SECRET" ]; then
            {
              printf 'OAuth__Discord__ClientId=%s\n' '${{ vars.DISCORD_CLIENT_ID }}'
              printf 'OAuth__Discord__ClientSecret=%s\n' "$DISCORD_SECRET"
            } >> vanalytics.env
          fi

      - name: Copy environment file to VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: vanalytics.env
          target: /opt/soverance/

      - name: Deploy container
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE: soveranceacr.azurecr.io/vanalytics:v${{ needs.build.outputs.version }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: ACR_USERNAME,ACR_PASSWORD,IMAGE
          script: |
            set -e
            cd /opt/soverance
            chmod 600 vanalytics.env
            sed -i "s|^VANALYTICS_IMAGE=.*|VANALYTICS_IMAGE=$IMAGE|" .env
            echo "$ACR_PASSWORD" | docker login soveranceacr.azurecr.io -u "$ACR_USERNAME" --password-stdin
            docker compose pull vanalytics
            # --force-recreate: env_file content changes alone don't trigger
            # recreation, which strands same-image redeploys (secret rotations)
            # on stale env
            docker compose up -d --force-recreate vanalytics
            docker image prune -f

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create and push tag
        run: |
          git tag "v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.build.outputs.version }}"
          name: "v${{ needs.build.outputs.version }}"
          generate_release_notes: true
